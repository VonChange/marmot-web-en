<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marmot API 实时日志</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        h1 {
            font-size: 18px;
            color: #4fc3f7;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls label {
            color: #888;
            font-size: 13px;
        }
        .controls select, .controls input {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .controls button {
            background: #4fc3f7;
            border: none;
            color: #000;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .controls button:hover {
            background: #81d4fa;
        }
        .controls button.stop {
            background: #ef5350;
            color: #fff;
        }
        .status {
            font-size: 12px;
            color: #888;
        }
        .status.running {
            color: #4caf50;
        }
        #log-container {
            background: #0d0d0d;
            border-radius: 8px;
            padding: 15px;
            height: calc(100vh - 120px);
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6;
        }
        .log-line {
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-line.info { color: #4caf50; }
        .log-line.warn { color: #ff9800; }
        .log-line.error { color: #f44336; }
        .log-line.debug { color: #9e9e9e; }
        .log-line .time { color: #666; }
        .log-line .level { font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦫 Marmot API 实时日志</h1>
        <div class="controls">
            <label>行数:</label>
            <select id="lines">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
                <option value="500">500</option>
            </select>
            <label>级别:</label>
            <select id="level">
                <option value="all" selected>全部</option>
                <option value="error">ERROR</option>
                <option value="warn">WARN+</option>
                <option value="info">INFO+</option>
                <option value="debug">DEBUG+</option>
            </select>
            <label>刷新:</label>
            <select id="interval">
                <option value="1000">1秒</option>
                <option value="3000" selected>3秒</option>
                <option value="5000">5秒</option>
                <option value="10000">10秒</option>
                <option value="0">手动</option>
            </select>
            <button id="toggle">⏸ 暂停</button>
            <button id="refresh">🔄 刷新</button>
            <span class="status running" id="status">● 运行中</span>
        </div>
    </div>
    <div id="log-container"></div>

    <script>
        const API_BASE = 'https://api.vonchange.com';
        let timer = null;
        let isRunning = true;
        let autoScroll = true;

        const logContainer = document.getElementById('log-container');
        const linesSelect = document.getElementById('lines');
        const levelSelect = document.getElementById('level');
        const intervalSelect = document.getElementById('interval');
        const toggleBtn = document.getElementById('toggle');
        const refreshBtn = document.getElementById('refresh');
        const statusEl = document.getElementById('status');

        // 级别优先级
        const LEVEL_PRIORITY = { debug: 0, info: 1, warn: 2, error: 3 };

        // 获取日志行的级别
        function getLogLevel(line) {
            if (line.includes(' ERROR ')) return 'error';
            if (line.includes(' WARN ')) return 'warn';
            if (line.includes(' INFO ')) return 'info';
            if (line.includes(' DEBUG ')) return 'debug';
            return 'info';
        }

        // 检查是否应该显示该日志行
        function shouldShowLog(line, filterLevel) {
            if (filterLevel === 'all') return true;
            const logLevel = getLogLevel(line);
            return LEVEL_PRIORITY[logLevel] >= LEVEL_PRIORITY[filterLevel];
        }

        // 解析日志行，添加颜色
        function formatLogLine(line) {
            const level = getLogLevel(line);
            
            // 移除 ANSI 颜色码
            line = line.replace(/\x1b\[[0-9;]*m/g, '');
            
            return `<div class="log-line ${level}">${escapeHtml(line)}</div>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function fetchLogs() {
            try {
                const lines = linesSelect.value;
                const level = levelSelect.value;
                const response = await fetch(`${API_BASE}/utao/admin/logs?lines=${lines}&level=${level}`);
                const data = await response.json();
                
                if (data.code === 0 && data.data) {
                    const html = data.data.map(formatLogLine).join('');
                    logContainer.innerHTML = html;
                    
                    if (autoScroll) {
                        logContainer.scrollTop = logContainer.scrollHeight;
                    }
                }
            } catch (error) {
                console.error('获取日志失败:', error);
            }
        }

        function startTimer() {
            const interval = parseInt(intervalSelect.value);
            if (interval > 0 && isRunning) {
                timer = setInterval(fetchLogs, interval);
            }
        }

        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        function updateStatus() {
            if (isRunning) {
                statusEl.textContent = '● 运行中';
                statusEl.className = 'status running';
                toggleBtn.textContent = '⏸ 暂停';
                toggleBtn.classList.remove('stop');
            } else {
                statusEl.textContent = '● 已暂停';
                statusEl.className = 'status';
                toggleBtn.textContent = '▶ 继续';
                toggleBtn.classList.add('stop');
            }
        }

        // 事件监听
        toggleBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            updateStatus();
            if (isRunning) {
                fetchLogs();
                startTimer();
            } else {
                stopTimer();
            }
        });

        refreshBtn.addEventListener('click', fetchLogs);

        intervalSelect.addEventListener('change', () => {
            stopTimer();
            startTimer();
        });

        linesSelect.addEventListener('change', fetchLogs);
        levelSelect.addEventListener('change', fetchLogs);

        // 检测是否滚动到底部
        logContainer.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = logContainer;
            autoScroll = scrollHeight - scrollTop - clientHeight < 50;
        });

        // 初始化
        fetchLogs();
        startTimer();
    </script>
</body>
</html>
